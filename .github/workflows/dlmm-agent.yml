name: dlmm-agent
on:
  push:
    paths: ["dlmm-agent/**", ".github/workflows/dlmm-agent.yml"]
  pull_request:
    paths: ["dlmm-agent/**", ".github/workflows/dlmm-agent.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dlmm-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dlmm-agent/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
