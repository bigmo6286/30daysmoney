# The store page on GitHub Pages (https://<owner>.github.io/<repo>/), built from checkout's product
# list, and the PnL dashboard at …/dashboard/. Needs Settings → Pages → Source: "GitHub Actions", and the repo variable SHOP_BOT.
# This must be the only workflow that deploys Pages: GitHub's starter "static" / "Jekyll" workflows
# publish the whole repository instead and overwrite the store on every push.
name: pages
on:
  push:
    branches: [main]
    paths: ["checkout/public/**", "checkout/src/site.ts", "checkout/src/config.ts", "pnl-dashboard/src/**", "pnl-dashboard/web/**", "pnl-dashboard/package-lock.json", ".github/workflows/**"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: vars.SHOP_BOT != ''
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            checkout/package-lock.json
            pnl-dashboard/package-lock.json
      - run: npm ci
        working-directory: checkout
      - run: npm run -s site -- ../_site
        working-directory: checkout
        env:
          SHOP_BOT: ${{ vars.SHOP_BOT }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          CHECK_EVERY_MIN: "15"
      - run: npm ci && npm run -s build:web -- ../_site/dashboard
        working-directory: pnl-dashboard
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
