# The serverless shop: every 5 minutes, answer the shop bot's Telegram messages, read new USDC
# payments, issue license keys and DM them to buyers. State (orders, cursors) is carried between
# runs in the Actions cache, encrypted with a key derived from LICENSE_PRIVATE_KEY.
# Off until the repo variable SHOP_ENABLED is "true". Setup: checkout/README.md#serverless-shop
name: shop
on:
  schedule:
    - cron: "*/5 * * * *"
  # also called every 5 min by an external cron (GitHub's own schedule starts late and skips runs
  # under load); see checkout/README.md#reliable-timing
  workflow_dispatch:
    inputs:
      check:
        description: "Also list which shop settings Actions can see"
        type: boolean
        default: false
concurrency:
  group: shop
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  # Run by hand (Actions → shop → Run workflow, tick "check") to see which settings Actions can
  # read: names only, set or missing, never values. A missing SHOP_ENABLED is why tick is skipped.
  check:
    if: inputs.check
    runs-on: ubuntu-latest
    steps:
      - run: |
          row() { if [ -n "$2" ]; then echo "| $1 | ✅ set |"; else echo "| $1 | ❌ missing |"; fi; }
          {
            echo "### Shop settings visible to Actions"
            echo "| name | |"; echo "|---|---|"
            row "vars.SHOP_ENABLED (= '$SHOP_ENABLED_VALUE', must be exactly true)" "$SHOP_ENABLED_VALUE"
            row "vars.SHOP_BOT" "$V_SHOP_BOT"; row "vars.BASE_RECEIVER" "$V_BASE"; row "vars.SOL_RECEIVER" "$V_SOL"; row "vars.CONTACT" "$V_CONTACT"
            row "secrets.SHOP_TG_TOKEN" "$S_TG"; row "secrets.LICENSE_PRIVATE_KEY" "$S_LIC"; row "secrets.ALCHEMY_KEY" "$S_ALC"; row "secrets.TG_OWNER_ID" "$S_OWNER"
          } | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          SHOP_ENABLED_VALUE: ${{ vars.SHOP_ENABLED }}
          V_SHOP_BOT: ${{ vars.SHOP_BOT }}
          V_BASE: ${{ vars.BASE_RECEIVER }}
          V_SOL: ${{ vars.SOL_RECEIVER }}
          V_CONTACT: ${{ vars.CONTACT }}
          S_TG: ${{ secrets.SHOP_TG_TOKEN != '' && 'x' || '' }}
          S_LIC: ${{ secrets.LICENSE_PRIVATE_KEY != '' && 'x' || '' }}
          S_ALC: ${{ secrets.ALCHEMY_KEY != '' && 'x' || '' }}
          S_OWNER: ${{ secrets.TG_OWNER_ID != '' && 'x' || '' }}
  tick:
    if: vars.SHOP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: checkout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            checkout/package-lock.json
            pnl-dashboard/package-lock.json
      - run: npm ci
      - uses: actions/cache/restore@v4
        with:
          path: shop-state.bin
          key: shop-state-${{ github.run_id }}
          restore-keys: shop-state-
      - id: unpack
        run: npm run -s state -- unpack ../shop-state.bin data
        env:
          LICENSE_PRIVATE_KEY: ${{ secrets.LICENSE_PRIVATE_KEY }}
      - run: npm run -s tick
        env:
          SHOP_TG_TOKEN: ${{ secrets.SHOP_TG_TOKEN }}
          LICENSE_PRIVATE_KEY: ${{ secrets.LICENSE_PRIVATE_KEY }}
          ALCHEMY_KEY: ${{ secrets.ALCHEMY_KEY }}
          TG_OWNER_ID: ${{ secrets.TG_OWNER_ID }}
          SOL_RECEIVER: ${{ vars.SOL_RECEIVER }}
          BASE_RECEIVER: ${{ vars.BASE_RECEIVER }}
          CONTACT: ${{ vars.CONTACT }}
          CHECK_EVERY_MIN: "5"
          GUIDE_KEY: ${{ secrets.GUIDE_KEY }}
          STORE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      # range alerts for Dashboard Pro (pnl-dashboard reads the watch list the shop bot keeps);
      # never blocks saving the state
      - if: always() && steps.unpack.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 4
        working-directory: pnl-dashboard
        run: npm ci --no-audit --no-fund && npm run -s alerts
        env:
          DATA_DIR: ../checkout/data
          SHOP_TG_TOKEN: ${{ secrets.SHOP_TG_TOKEN }}
          ALCHEMY_KEY: ${{ secrets.ALCHEMY_KEY }}
          STORE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      # save even if the tick failed halfway (it records progress as it goes), but never after a
      # failed unpack: that would replace the real orders with an empty book
      - if: always() && steps.unpack.outcome == 'success'
        run: npm run -s state -- pack data ../shop-state.bin
        env:
          LICENSE_PRIVATE_KEY: ${{ secrets.LICENSE_PRIVATE_KEY }}
      - if: always() && steps.unpack.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: shop-state.bin
          key: shop-state-${{ github.run_id }}-${{ github.run_attempt }}
