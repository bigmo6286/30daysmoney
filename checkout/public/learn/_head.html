:root { color-scheme: light; --bg: #f6f6f3; --panel: #fff; --ink: #121417; --ink-2: #3f444c; --muted: #646a74; --line: #e0e1e4; --accent: #2a63e8; --accent-ink: #fff; }
@media (prefers-color-scheme: dark) { :root { color-scheme: dark; --bg: #0e1013; --panel: #161a20; --ink: #eceef2; --ink-2: #c9ced6; --muted: #9aa2ae; --line: #272c35; --accent: #6f98ff; --accent-ink: #0e1013; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.65 system-ui, -apple-system, "Segoe UI", sans-serif; }
header, main, footer { max-width: 760px; margin: 0 auto; padding: 0 16px; }
header { display: flex; justify-content: space-between; align-items: center; height: 56px; font-size: 15px; }
header a { color: var(--ink-2); text-decoration: none; }
header b a { color: var(--ink); }
main { padding-bottom: 56px; overflow-wrap: anywhere; }
h1 { font-size: clamp(28px, 5vw, 38px); line-height: 1.15; letter-spacing: -0.02em; margin: 24px 0 12px; }
h2 { font-size: 22px; margin: 36px 0 8px; letter-spacing: -0.01em; }
.lead { color: var(--ink-2); font-size: 18px; }
a { color: var(--accent); }
code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.88em; background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }
table { border-collapse: collapse; margin: 12px 0; font-size: 15px; display: block; max-width: 100%; overflow-x: auto; }
th, td { border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: left; overflow-wrap: normal; vertical-align: top; }
td:first-child { min-width: 112px; }
td code { overflow-wrap: anywhere; }
th { color: var(--muted); font-weight: 600; }
.cta { display: inline-block; background: var(--accent); color: var(--accent-ink); font-weight: 600; text-decoration: none; padding: 11px 18px; border-radius: 10px; margin: 8px 8px 0 0; }
.cta.alt { background: var(--panel); color: var(--ink); border: 1px solid var(--line); }
.note { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin: 20px 0; font-size: 15.5px; color: var(--ink-2); }
footer { border-top: 1px solid var(--line); padding: 20px 16px 40px; color: var(--muted); font-size: 14px; }
</style>
